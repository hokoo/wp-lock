name: PHPUnit Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate:
        description: Run the two newest database candidate rows on this ref
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis (PHP 7.4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '7.4'
          extensions: dom, mbstring, simplexml, xml, xmlwriter
          coverage: none
      - name: Install PHP dependencies
        uses: ramsey/composer-install@b38926e6aa883a48335a05214b1d7afe9d9913ca # 3.1.1
      - name: Check WordPress coding standards
        run: composer lint
      - name: Run PHPStan
        run: composer analyse

  native-lts:
    name: Native LTS ${{ matrix.row }} (RR + RC)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        row: [mysql97, maria123, mysql97-floor, maria123-floor]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare Composer
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install --yes subversion
      - name: Run native Composer suite on both isolations
        env:
          E5_NATIVE_OUT: ${{ runner.temp }}/e5-native-${{ matrix.row }}
        run: bash tests/diagnostics/e5-native-matrix.sh '${{ matrix.row }}'
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e5-native-lts-${{ matrix.row }}
          path: ${{ runner.temp }}/e5-native-${{ matrix.row }}/evidence
          if-no-files-found: error

  native-candidate:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.candidate == true)
    name: Native candidate ${{ matrix.row }} (RR + RC)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        row: [mysql267, maria130]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare Composer
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install --yes subversion
      - name: Run native Composer suite on both isolations
        env:
          E5_NATIVE_OUT: ${{ runner.temp }}/e5-native-${{ matrix.row }}
        run: bash tests/diagnostics/e5-native-matrix.sh '${{ matrix.row }}'
      - name: Retain candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e5-native-candidate-${{ matrix.row }}
          path: ${{ runner.temp }}/e5-native-${{ matrix.row }}/evidence
          if-no-files-found: error

  phpunit:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php-version: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]

    services:
      mysql:
        image: mariadb:10.11.10
        ports:
          - '3306:3306'
        env:
          MARIADB_ROOT_PASSWORD: wordpress
          MARIADB_DATABASE: wordpress_test
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_INITDB_SKIP_TZINFO: 1
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, pcntl, posix
          coverage: none

      - name: Install PHP dependencies
        uses: ramsey/composer-install@b38926e6aa883a48335a05214b1d7afe9d9913ca # 3.1.1

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install --yes subversion

      - name: Set up WordPress test library
        uses: sjinks/setup-wordpress-test-library@9726426f2a40656274560a0394718177f8adb424 # v3.0.0
        with:
          version: '7.1.2'

      - name: Run PHPUnit
        run: composer test

  coverage:
    name: Coverage (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mariadb:10.11.10
        ports:
          - '3306:3306'
        env:
          MARIADB_ROOT_PASSWORD: wordpress
          MARIADB_DATABASE: wordpress_test
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_INITDB_SKIP_TZINFO: 1
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP with PCOV
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          extensions: mysqli, pcntl, posix
          coverage: pcov

      - name: Install PHP dependencies
        uses: ramsey/composer-install@b38926e6aa883a48335a05214b1d7afe9d9913ca # 3.1.1

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install --yes subversion

      - name: Set up WordPress test library
        uses: sjinks/setup-wordpress-test-library@9726426f2a40656274560a0394718177f8adb424 # v3.0.0
        with:
          version: '7.1.2'

      - name: Generate Clover coverage
        run: |
          mkdir -p build/logs
          composer test:coverage

      - name: Enforce 90% line coverage
        run: >-
          php -r '$clover = simplexml_load_file("build/logs/clover.xml");
          $metrics = $clover->project->metrics;
          $total = (int) $metrics["statements"];
          $covered = (int) $metrics["coveredstatements"];
          if (0 === $total) { fwrite(STDERR, "No executable lines found in Clover report.\n"); exit(1); }
          $percentage = 100 * $covered / $total;
          printf("Line coverage: %.2f%% (%d/%d)\n", $percentage, $covered, $total);
          exit($percentage >= 90 ? 0 : 1);'
